name: Build, scan and publish
run-name: RabbitMQ image qualification

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      force_rebuild:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when inputs and the active scan are unchanged
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check resolver and publication decisions
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check recipe rendering
        run: python3 -m tools.render_recipe --check
      - name: Check shell scripts
        run: |
          bash -n tests/test-image.sh
          bash -n scripts/trivy/resolve-version.sh
          shellcheck tests/test-image.sh scripts/trivy/resolve-version.sh
      - name: Check Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint:v2.14.0 < Dockerfile
          docker run --rm -i hadolint/hadolint:v2.14.0 < tests/client/Dockerfile
      - name: Check GitHub Actions workflows
        run: docker run --rm --entrypoint actionlint -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color

  candidate:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.0.0
      - name: Build and qualify without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.pipeline check
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: candidate-evidence-${{ github.run_id }}
          path: |
            build/inputs.json
            build/metadata.json
            build/trivy-*.json
            build/runtime-*.log
            build/sbom.json
            build/provenance.json
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: rabbitmq-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.0.0
      - uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve, scan and rebuild when required
        env:
          GH_TOKEN: ${{ github.token }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          args=()
          if [ "$FORCE_REBUILD" = true ]; then args+=(--force-rebuild); fi
          python3 -m tools.pipeline auto "${args[@]}"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: publication-evidence-${{ github.run_id }}
          path: |
            build/inputs.json
            build/metadata.json
            build/trivy-*.json
            build/runtime-*.log
            build/sbom.json
            build/provenance.json
          retention-days: 14
