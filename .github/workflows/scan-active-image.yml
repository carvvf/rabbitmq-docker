name: Active GHCR image status
run-name: Daily RabbitMQ source-build scan

on:
  schedule:
    # UTC schedule; Europe/Rome: 00:47 CET / 01:47 CEST.
    - cron: '47 23 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when inputs and the active scan are unchanged
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  scan-and-rebuild:
    uses: ./.github/workflows/ci.yml
    with:
      force_rebuild: ${{ inputs.force_rebuild || false }}
